# Local development database (Docker PostgreSQL).
# Credentials are loaded from the external secrets file when running locally.
spring.config.import=optional:file:../secrets/application-local.properties

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:governai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Local browser is HTTP.
spring.web.resources.cache.period=0
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
