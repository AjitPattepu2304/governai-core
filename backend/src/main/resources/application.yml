spring:
  application:
    name: governai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/governai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
