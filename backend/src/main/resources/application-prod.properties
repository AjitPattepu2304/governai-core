# Production database configuration.
# Set these environment variables in Render; do not commit production secrets.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Render serves the application over HTTPS.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
